[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hw-ai-agent"
version = "0.1.0"
description = "A small, safe coding agent with OpenAI-compatible tool calling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["certifi>=2025.1.31"]

[project.scripts]
hw-ai-agent = "hw_ai_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

